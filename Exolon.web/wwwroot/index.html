<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exolon</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Exolon">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="pwa-180.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <!-- Start the big downloads before godot.js even runs; the dotnet.* files
         are otherwise only discovered mid-boot. -->
    <script>
        // Opt-in: fetch the .gz siblings the 2dog publish writes (engine, pack
        // and _framework binaries) and inflate them in the page. For hosts that
        // serve everything uncompressed. Publishing with
        // TwoDogWebPrecompressKeepOriginals=false switches it on in the app
        // bundle. A host that already content-encodes would compress them a
        // second time.
        const TWODOG_PCK_GZ = false;
        // The hints must name the files the engine fetches, or both download.
        const twodogGz = TWODOG_PCK_GZ && typeof DecompressionStream !== 'undefined';
        for (const file of ['godot.wasm', 'godot.pck']) {
            const hint = document.createElement('link');
            hint.rel = 'preload';
            hint.as = 'fetch';
            hint.crossOrigin = 'anonymous';
            hint.href = twodogGz ? file + '.gz' : file;
            document.head.appendChild(hint);
        }
    </script>
    <link rel="modulepreload" href="_framework/dotnet.js">
    <link rel="modulepreload" href="_framework/dotnet.boot.js">
    <link rel="modulepreload" href="_framework/dotnet.runtime.js">
    <link rel="modulepreload" href="_framework/dotnet.native.js">
    <style>
        html,
        body,
        #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }

        body {
            color: white;
            background-color: black;
            overflow: hidden;
            touch-action: none;
        }

        #canvas {
            display: block;
        }

        #canvas:focus {
            outline: none;
        }

        #touch-controls { display: none; }
        #install-app {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            top: max(12px, env(safe-area-inset-top));
            z-index: 3;
            padding: 8px 14px;
            border: 1px solid #e8d24c;
            border-radius: 6px;
            color: #fff;
            background: #1a1a1a;
            font: 600 14px system-ui, sans-serif;
        }

        @media (pointer: coarse) {
            #canvas {
                position: fixed;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw !important;
                height: auto !important;
                top: 50dvh;
                image-rendering: pixelated;
            }
            #touch-controls.ready {
                position: fixed;
                inset: 0;
                z-index: 1;
                display: block;
                pointer-events: none;
            }
            .touch-area {
                position: absolute;
                top: calc(50dvh + 37.5vw + 20px);
                bottom: 0;
                touch-action: none; user-select: none; -webkit-user-select: none;
            }
            #touch-directions {
                right: 0; width: 70.7%;
                display: grid;
                grid-template-columns: minmax(0, 9fr) minmax(0, 7fr) minmax(0, 11fr);
                grid-template-rows: 2fr .5fr 1.5fr 1fr;
            }
            .touch-zone {
                pointer-events: auto; touch-action: none;
                display: grid; place-items: center;
                background: rgba(255, 255, 255, .02);
                box-sizing: border-box;
                color: rgba(255, 255, 255, .4);
                font: 600 clamp(24px, 6vw, 48px) system-ui, sans-serif;
            }
            .touch-zone svg {
                width: min(80%, clamp(30px, 7vw, 56px)); height: auto;
                aspect-ratio: 1;
                pointer-events: none; stroke: currentColor;
            }
            .touch-zone[data-keys="ArrowUp ArrowLeft"] { grid-area: 1 / 1; }
            .touch-zone[data-keys="ArrowUp"] { grid-area: 1 / 2 / 3 / 3; }
            .touch-zone[data-keys="ArrowUp ArrowRight"] { grid-area: 1 / 3; }
            .touch-zone[data-keys="ArrowLeft"] { grid-area: 2 / 1 / 5 / 2; }
            .touch-zone[data-keys="ArrowRight"] { grid-area: 2 / 3 / 5 / 4; }
            .touch-zone[data-keys="ArrowDown"] { grid-area: 3 / 2 / 5 / 3; }
            .touch-zone[data-keys="ArrowUp ArrowLeft"],
            .touch-zone[data-keys="ArrowLeft"],
            .touch-zone[data-keys="ArrowUp"],
            .touch-zone[data-keys="ArrowDown"] { border-right: 1px solid rgba(255, 255, 255, .13); }
            .touch-zone[data-keys="ArrowUp ArrowLeft"],
            .touch-zone[data-keys="ArrowUp ArrowRight"],
            .touch-zone[data-keys="ArrowUp"] { border-bottom: 1px solid rgba(255, 255, 255, .13); }
            #touch-fire { left: 0; width: 29.3%; pointer-events: auto; }
        }

        @media (pointer: coarse) and (orientation: portrait) {
            #touch-directions { box-shadow: inset 1px 0 rgba(255, 255, 255, .13); }
        }

        @media (pointer: coarse) and (orientation: landscape) {
            :root {
                --landscape-fire-min: 80px;
                --landscape-directions-min: 80px;
                --landscape-game-width: min(calc(100dvh * 4 / 3), max(0px, calc(100vw - var(--landscape-fire-min) - var(--landscape-directions-min) - 40px)));
            }
            #canvas {
                top: 50%;
                left: calc(50vw + (var(--landscape-fire-min) - var(--landscape-directions-min)) / 2);
                transform: translate(-50%, -50%);
                width: var(--landscape-game-width) !important;
            }
            .touch-area { top: 0; }
            #touch-fire { width: max(0px, calc((100vw - var(--landscape-game-width) + var(--landscape-fire-min) - var(--landscape-directions-min)) / 2 - 20px)); }
            #touch-directions { width: max(0px, calc((100vw - var(--landscape-game-width) - var(--landscape-fire-min) + var(--landscape-directions-min)) / 2 - 20px)); }
        }

        @media (pointer: coarse) and (orientation: landscape) and (max-aspect-ratio: 8/5) {
            :root {
                --landscape-fire-min: min(120px, calc((100vw - 40px) / 4));
                --landscape-game-min: min(256px, calc((100vw - 40px) / 3));
                --landscape-directions-min: min(280px, max(0px, calc(100vw - 40px - var(--landscape-fire-min) - var(--landscape-game-min))));
            }
        }

        /* Painted above #status (which JavaScript would otherwise remove) so
           the message is visible when scripts are disabled. */
        noscript {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #242424;
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
        }

        #status {
            position: absolute;
            inset: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        #status-splash {
            width: min(80vw, 512px);
            height: auto;
            image-rendering: pixelated;
        }

        #status-bar {
            position: relative;
            width: min(60%, 320px);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            background-color: #4a4a4a;
            display: none;
        }

        /* Kept for screen readers, which announce an indeterminate progress as busy. */
        #status-progress {
            position: absolute;
            inset: 0;
            opacity: 0;
        }

        /* Engine startup blocks the page for seconds, freezing a native progress bar;
           a transform animation runs on the compositor and keeps moving. */
        #status-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 30%;
            background-color: #e0e0e0;
            animation: status-busy 1.2s ease-in-out infinite;
        }

        @keyframes status-busy {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(340%);
            }
        }

        #status-notice {
            background-color: #5b3943;
            border-radius: 0.5rem;
            border: 1px solid #9b3943;
            color: #e0e0e0;
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
            line-height: 1.3;
            margin: 0 2rem;
            overflow: hidden;
            padding: 1rem;
            text-align: center;
            /* Failure notices carry meaningful newlines (missing-feature lists). */
            white-space: pre-line;
            z-index: 1;
            display: none;
        }
    </style>
</head>

<body>
    <button id="install-app" type="button" hidden>Install Exolon</button>
    <canvas id="canvas" width="512" height="384">
        Your browser does not support the canvas tag.
    </canvas>

    <div id="touch-controls" aria-label="Game controls">
        <div id="touch-directions" class="touch-area">
            <div class="touch-zone" data-keys="ArrowUp ArrowLeft" aria-label="Jump left"></div>
            <div class="touch-zone" data-keys="ArrowUp" aria-label="Up"></div>
            <div class="touch-zone" data-keys="ArrowUp ArrowRight" aria-label="Jump right"></div>
            <div class="touch-zone" data-keys="ArrowLeft" aria-label="Left"></div>
            <div class="touch-zone" data-keys="ArrowRight" aria-label="Right"></div>
            <div class="touch-zone" data-keys="ArrowDown" aria-label="Down"></div>
        </div>
        <div id="touch-fire" class="touch-area touch-zone" data-keys="Space" aria-label="Fire"></div>
    </div>

    <noscript>
        Your browser does not support JavaScript.
    </noscript>

    <div id="status">
        <img id="status-splash" src="splash.png" alt="Exolon — loading">
        <div id="status-bar"><progress id="status-progress" aria-label="Loading progress"></progress></div>
        <div id="status-notice" role="alert"></div>
    </div>

    <script>
        let installPrompt;
        let gameStarted = false;
        const installButton = document.getElementById('install-app');
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            installPrompt = event;
            if (!gameStarted) installButton.hidden = false;
        });
        installButton.addEventListener('click', async () => {
            if (!installPrompt) return;
            const prompt = installPrompt;
            installPrompt = null;
            installButton.hidden = true;
            await prompt.prompt();
        });
        window.addEventListener('appinstalled', () => { installPrompt = null; installButton.hidden = true; });
        window.exolonGameStarted = () => {
            gameStarted = true;
            installButton.hidden = true;
        };
    </script>
    <script src="godot.js"></script>
    <script>

        // Forward independent pointers as the same keys used by the desktop game.
        // This permits holding movement and fire together, including grenade fire.
        const controls = document.getElementById('touch-controls');
        const canvas = document.getElementById('canvas');
        // Lucide/Feather icons; rotate the same arrow for all directions.
        const arrowAngles = { 'ArrowUp': 0, 'ArrowUp ArrowRight': 45, 'ArrowRight': 90,
            'ArrowDown': 180, 'ArrowLeft': -90, 'ArrowUp ArrowLeft': -45 };
        for (const zone of controls.querySelectorAll('.touch-zone')) {
            const fire = zone.dataset.keys === 'Space';
            const shape = fire
                ? '<circle cx="12" cy="12" r="8"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/>'
                : '<path d="M12 19V5M5 12l7-7 7 7"/>';
            const angle = fire ? 0 : arrowAngles[zone.dataset.keys];
            zone.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(${angle}deg)">${shape}</svg>`;
        }
        const activePointers = new Map();
        const capturedPointers = new Set();
        const keyCounts = new Map();
        const keyDownAt = new Map();
        const releaseTimers = new Map();
        const keyCodes = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Space: 32 };
        function sendKey(code, pressed) {
            canvas.dispatchEvent(new KeyboardEvent(pressed ? 'keydown' : 'keyup', {
                key: code === 'Space' ? ' ' : code, code, keyCode: keyCodes[code],
                which: keyCodes[code], bubbles: true, cancelable: true
            }));
        }
        function changePointer(id, zone, delayedRelease = false) {
            const oldKeys = activePointers.get(id) || [];
            const newKeys = zone ? zone.dataset.keys.split(' ') : [];
            for (const code of oldKeys.filter(key => !newKeys.includes(key))) {
                const count = keyCounts.get(code) - 1;
                keyCounts.set(code, count);
                if (!count) {
                    // A short tap must span a Godot frame; sliding changes direction immediately.
                    const delay = delayedRelease ? Math.max(0, 100 - (performance.now() - keyDownAt.get(code))) : 0;
                    if (!delay) { sendKey(code, false); continue; }
                    releaseTimers.set(code, setTimeout(() => { sendKey(code, false); releaseTimers.delete(code); }, delay));
                }
            }
            for (const code of newKeys.filter(key => !oldKeys.includes(key))) {
                const count = keyCounts.get(code) || 0;
                keyCounts.set(code, count + 1);
                if (!count) {
                    canvas.focus();
                    if (releaseTimers.has(code)) { clearTimeout(releaseTimers.get(code)); releaseTimers.delete(code); }
                    else { sendKey(code, true); keyDownAt.set(code, performance.now()); }
                }
            }
            if (newKeys.length) activePointers.set(id, newKeys);
            else activePointers.delete(id);
        }
        controls.addEventListener('pointerdown', event => {
            const zone = event.target.closest('.touch-zone');
            if (!zone) return;
            event.preventDefault();
            zone.setPointerCapture(event.pointerId);
            capturedPointers.add(event.pointerId);
            changePointer(event.pointerId, zone);
        });
        controls.addEventListener('pointermove', event => {
            if (!capturedPointers.has(event.pointerId)) return;
            const zone = document.elementFromPoint(event.clientX, event.clientY)?.closest('.touch-zone');
            changePointer(event.pointerId, zone || null);
        });
        for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
            controls.addEventListener(type, event => { changePointer(event.pointerId, null, type === 'pointerup'); capturedPointers.delete(event.pointerId); });
        }
        function releaseAllTouches() {
            for (const id of [...activePointers.keys()]) changePointer(id, null);
            capturedPointers.clear();
            for (const [code, timer] of releaseTimers) { clearTimeout(timer); sendKey(code, false); }
            releaseTimers.clear();
        }
        window.addEventListener('blur', releaseAllTouches);
        window.addEventListener('resize', releaseAllTouches);
        document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllTouches(); });

        const GODOT_CONFIG = {
            'args': [],
            'canvasResizePolicy': matchMedia('(pointer: coarse)').matches ? 0 : 2,
            'ensureCrossOriginIsolationHeaders': false,
            'executable': 'godot',
            'experimentalVK': false,
            'focusCanvas': true,
            'gdextensionLibs': []
        };
        const GODOT_THREADS_ENABLED = false;

        (function () {
            performance.mark('2dog:boot');

            const statusOverlay = document.getElementById('status');
            const statusBar = document.getElementById('status-bar');
            const statusNotice = document.getElementById('status-notice');

            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    controls.classList.add('ready');
                    initializing = false;
                    return;
                }
                statusBar.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function displayFailureNotice(err) {
                console.error(err);
                statusNotice.textContent = typeof err?.message === 'string' ? err.message : String(err);
                setStatusMode('notice');
                initializing = false;
            }

            let downloadsDone = false;

            function reportProgress(current, total) {
                if (!downloadsDone && total > 0 && current >= total) {
                    downloadsDone = true;
                    performance.mark('2dog:downloads-done');
                }
            }

            // The gz pack path re-points this at a merged reporter.
            let engineProgress = reportProgress;

            function startWithGzPack(fileSizes, makeEngine) {
                // A rejected probe (network error, service worker failure)
                // falls back to the uncompressed pack exactly like a 404.
                return fetch('godot.pck.gz').catch(() => null).then((response) => {
                    if (!response || !response.ok || !response.body) {
                        console.warn('2dog: godot.pck.gz unavailable, falling back to godot.pck');
                        return makeEngine('').startGame({});
                    }
                    const engine = makeEngine('.gz');
                    // The engine only downloads the wasm here; this page fetches
                    // and inflates the pack, merging both into one download
                    // timing (compressed pack bytes against its Content-Length).
                    let pckLoaded = 0;
                    let wasmLoaded = 0;
                    let wasmTotal = fileSizes['godot.wasm'] || 0;
                    const pckTotal = Number(response.headers.get('Content-Length')) || 0;
                    const report = () => reportProgress(wasmLoaded + pckLoaded,
                        wasmTotal > 0 && pckTotal > 0 ? wasmTotal + pckTotal : 0);
                    engineProgress = (current, total) => {
                        wasmLoaded = current;
                        if (total > 0) wasmTotal = total;
                        report();
                    };
                    const counted = new TransformStream({
                        transform(chunk, controller) {
                            pckLoaded += chunk.byteLength;
                            report();
                            controller.enqueue(chunk);
                        },
                    });
                    const pack = new Response(
                        response.body.pipeThrough(counted).pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
                    return Promise.all([
                        engine.init(GODOT_CONFIG['executable']),
                        pack.then((buffer) => engine.preloadFile(buffer, 'godot.pck')),
                    ]).then(() => engine.start({ 'args': ['--main-pack', 'godot.pck'].concat(GODOT_CONFIG['args']) }));
                });
            }

            function reportTimings() {
                performance.mark('2dog:first-frame');
                const total = performance.measure('2dog:total', '2dog:boot', '2dog:first-frame').duration;
                let text = '2dog: first frame ' + Math.round(total) + ' ms after boot';
                if (downloadsDone) {
                    const tail = performance.measure('2dog:tail', '2dog:downloads-done', '2dog:first-frame').duration;
                    text += ' (' + Math.round(total - tail) + ' ms downloading, ' + Math.round(tail) + ' ms starting)';
                }
                console.log(text);
                // Detail table on demand (?2dog-timing). transferSize reads 0
                // for memory-cache hits - measure with caching disabled.
                if (!new URLSearchParams(location.search).has('2dog-timing')) {
                    return;
                }
                const rows = performance.getEntriesByType('resource')
                    .filter((entry) => entry.transferSize > 100000)
                    .sort((a, b) => b.transferSize - a.transferSize)
                    .map((entry) => ({
                        file: entry.name.replace(/.*\//, ''),
                        'wire kB': Math.round(entry.transferSize / 1000),
                        ms: Math.round(entry.duration),
                    }));
                if (rows.length) console.table(rows);
            }

            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
                renderingDriver: GODOT_CONFIG['renderingDriver'],
            });

            if (missing.length !== 0) {
                const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                displayFailureNotice(missingMsg + missing.join('\n'));
                return;
            }

            // Exact sizes written by the publish split the first-frame timing
            // into downloading and starting (Content-Length is the compressed
            // size on hosts that gzip, so headers lie).
            fetch('twodog.sizes.json')
                .then((response) => (response.ok ? response.json() : {}))
                .catch(() => ({}))
                .then((fileSizes) => {
                    // The suffix decides which files the engine fetches, so
                    // the Engine is only constructed after the pack probe has
                    // picked a path - a '.gz'-configured engine in the
                    // fallback would re-request the sibling that just 404'd.
                    const makeEngine = (suffix) => {
                        GODOT_CONFIG['fileSizes'] = fileSizes;
                        GODOT_CONFIG['onProgress'] = (current, total) => engineProgress(current, total);
                        // Newer engines also inflate .gz siblings themselves
                        // (godot.wasm.gz included); older ones ignore this key.
                        GODOT_CONFIG['precompressedSuffix'] = suffix;
                        return new Engine(GODOT_CONFIG);
                    };
                    setStatusMode('progress');
                    const started = twodogGz
                        ? startWithGzPack(fileSizes, makeEngine)
                        : makeEngine('').startGame({});
                    return started.then(() => {
                        reportTimings();
                        setStatusMode('hidden');
                    }, displayFailureNotice);
                })
                .catch(displayFailureNotice);
        }());
    </script>
</body>

</html>
