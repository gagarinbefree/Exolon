name: Build and deploy web game

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools
      - name: Build desktop game
        run: dotnet build Exolon.csproj --configuration Debug
      - name: Publish browser game
        run: dotnet publish Exolon.web --configuration Release -p:TwoDogRequireImport=true -p:TwoDogWebPrecompress=false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Start browser game
        run: python3 -m http.server 8765 --directory Exolon.web/AppBundle > /tmp/exolon-web-server.log 2>&1 &
      - name: Test game startup
        run: node tools/web-smoke.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-smoke
          path: artifacts/*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: Exolon.web/AppBundle

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
